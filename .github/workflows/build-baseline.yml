name: Baseline upstream IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        required: false
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-26-intel

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355

    steps:
      - name: Show runner
        run: |
          set -x
          sw_vers
          uname -m
          sysctl -n hw.memsize
          sysctl -n hw.ncpu
          df -h /
          du -sh /Applications
          ls -1 /Applications | grep -i xcode || true
          /usr/bin/xcodebuild -version || true

      - name: Free disk space
        run: |
          set -x
          for app in /Applications/Xcode_*.app; do
            case "$app" in
              /Applications/Xcode_26.6.app) echo "keeping $app" ;;
              *) sudo rm -rf "$app" ;;
            esac
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes/* || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
          df -h /

      - name: Checkout upstream release-13.0.0
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: release-13.0.0
          submodules: recursive
          fetch-depth: 0
          path: telegram-ios

      - name: Select Xcode 26.6
        run: |
          set -x
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          df -h /

      - name: Prepare Bazel 9.2.0
        run: |
          set -x
          BAZELISK="$(command -v bazelisk || true)"
          echo "bazelisk=$BAZELISK"
          test -n "$BAZELISK"
          export USE_BAZEL_VERSION=9.2.0
          "$BAZELISK" --version
          echo "USE_BAZEL_VERSION=9.2.0" >> "$GITHUB_ENV"

      - name: Prepare wasi-sdk for x86_64
        if: runner.arch == 'X64'
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          URL='https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-macos.tar.gz'
          curl -fsSL "$URL" -o /tmp/wasi-sdk.tar.gz
          mkdir -p /tmp/wasi-sdk
          tar -xzf /tmp/wasi-sdk.tar.gz -C /tmp/wasi-sdk --strip-components=1
          test -x /tmp/wasi-sdk/bin/clang++
          echo "build --override_repository=wasi_sdk_macos=/tmp/wasi-sdk" >> .bazelrc

      - name: Refresh expired fake provisioning profiles
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          CERTS=build-system/fake-codesigning/certs
          PROFILES=build-system/fake-codesigning/profiles
          openssl version
          openssl pkcs12 -legacy -in "$CERTS/SelfSigned.p12" -passin pass: -clcerts -nokeys -out /tmp/fake-cert.pem || openssl pkcs12 -in "$CERTS/SelfSigned.p12" -passin pass: -clcerts -nokeys -out /tmp/fake-cert.pem
          openssl pkcs12 -legacy -in "$CERTS/SelfSigned.p12" -passin pass: -nocerts -nodes -out /tmp/fake-key.pem || openssl pkcs12 -in "$CERTS/SelfSigned.p12" -passin pass: -nocerts -nodes -out /tmp/fake-key.pem
          for f in "$PROFILES"/*.mobileprovision; do
            openssl cms -verify -inform DER -in "$f" -noverify -out /tmp/profile.plist
            python3 -c 'import datetime,plistlib,sys; p=sys.argv[1]; d=plistlib.load(open(p,"rb")); d["ExpirationDate"]=datetime.datetime(2029,6,1); d["TimeToLive"]=900; plistlib.dump(d,open(p,"wb"))' /tmp/profile.plist
            openssl cms -sign -binary -in /tmp/profile.plist -signer /tmp/fake-cert.pem -inkey /tmp/fake-key.pem -outform DER -nodetach -out "$f"
            echo "refreshed $f"
          done

      - name: Build unsigned IPA
        working-directory: telegram-ios
        run: |
          set -x
          export USE_BAZEL_VERSION=9.2.0
          BAZELISK="$(command -v bazelisk)"
          df -h /
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazel="$BAZELISK" \
            --bazelUserRoot=/Users/runner/bazel-root \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${{ github.run_number }}"

      - name: Collect IPA and report disk
        working-directory: telegram-ios
        run: |
          set -x
          df -h /
          du -sh bazel-out 2>/dev/null || true
          mkdir -p build/artifacts
          cp bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa build/artifacts/ || true
          ls -la build/artifacts
          test -f build/artifacts/Telegram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: qxgram-baseline-ipa
          path: telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
